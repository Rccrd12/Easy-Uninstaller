[package]
name = "easy-uninstaller"
version = "0.2.0"
description = "A lightweight, simple app to uninstall apps and free up space on Windows"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "easy_uninstaller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }
# Already in the dependency tree through Tauri; reads and writes the quarantine manifests.
serde_json = "1"
# In-app updates from GitHub Releases, checked with the public key in tauri.conf.json.
# Without default features: no zip/tar support (the NSIS installer is downloaded as is), and
# HTTPS through the system's TLS (Schannel on Windows) instead of bundling rustls.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# Already in the dependency tree through Tauri; only these API areas are compiled in.
windows = { version = "0.62", features = [
  "ApplicationModel_Core",
  "Management_Deployment",
  "Win32_Graphics_Gdi",
  # The local index: frames of videos through Media Foundation, which ships with Windows.
  "Win32_Media_MediaFoundation",
  # The AI help: HTTPS through the system's WinHTTP, API keys in Credential Manager.
  "Win32_Networking_WinHttp",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Keep the shipped binary as small as possible.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
