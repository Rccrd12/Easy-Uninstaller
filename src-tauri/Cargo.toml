[package]
name = "easy-uninstaller"
version = "0.1.0"
description = "A lightweight, simple app to uninstall apps and free up space on Windows"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[lib]
name = "easy_uninstaller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }
# Already in the dependency tree through Tauri; reads and writes the quarantine manifests.
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# Already in the dependency tree through Tauri; only these API areas are compiled in.
windows = { version = "0.62", features = [
  "ApplicationModel_Core",
  "Management_Deployment",
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Keep the shipped binary as small as possible.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
