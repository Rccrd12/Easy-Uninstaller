[package]
name = "easy-uninstaller"
version = "0.1.0"
description = "A lightweight, simple app to uninstall apps and free up space on Windows"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"

[lib]
name = "easy_uninstaller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }

# Keep the shipped binary as small as possible.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
